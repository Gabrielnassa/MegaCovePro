# Publica e configura TUDO do servidor numa rodada:
#   banco (migrações) · funções · segredos das funções · login (URLs, confirmação, modelos de e-mail, SMTP do Resend)
#   · domínio no Resend (mostra o DNS a criar) · webhook no Asaas · chaves públicas no site (assets/plano.js)
# Roda sozinho quando algo muda em supabase/ e pelo botão "Run workflow" (aba Actions). Pode rodar quantas vezes quiser.
#
# Segredos (Settings → Secrets and variables → Actions):
#   obrigatórios: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
#   recomendados: DOMINIO (ex.: megacover.com.br), ASAAS_API_KEY, RESEND_API_KEY
#   e-mail:       EMAIL_DOMINIO (domínio de onde saem os e-mails, ex.: nassatech.com.br; padrão = DOMINIO), SUPORTE_EMAIL
#   opcionais:    ASAAS_AMBIENTE (padrão sandbox; "producao" para cobrar de verdade), EMAIL_REMETENTE, SUPORTE_EMAIL,
#                 TAREFA_TOKEN e ASAAS_WEBHOOK_TOKEN (se não existirem, são calculados a partir da senha do banco)
name: Publicar servidor

on:
  push:
    branches: [main]
    paths: ["supabase/**", "assets/regras.json", "assets/permissoes.js", "assets/engine.js", "tools/*.mjs", "tools/segredos.sh"]
  workflow_dispatch: {}

concurrency: servidor

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir configuração
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase ainda não configurado (faltam SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF ou SUPABASE_DB_PASSWORD). Nada foi publicado."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Calcular valores derivados
        if: steps.cfg.outputs.ok == '1'
        env:
          DOMINIO: ${{ secrets.DOMINIO }}
          EMAIL_DOMINIO: ${{ secrets.EMAIL_DOMINIO }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_AMBIENTE: ${{ secrets.ASAAS_AMBIENTE }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_PROVEDOR: ${{ secrets.EMAIL_PROVEDOR }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SUPORTE_EMAIL: ${{ secrets.SUPORTE_EMAIL }}
          TAREFA_TOKEN: ${{ secrets.TAREFA_TOKEN }}
        run: bash tools/segredos.sh
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == '1'
        with:
          node-version: "20"
      - name: Conferir cópias das regras
        if: steps.cfg.outputs.ok == '1'
        run: node tools/sincronizar.mjs --verificar
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == '1'
        with:
          version: latest
      - name: Banco de dados (migrações)
        if: steps.cfg.outputs.ok == '1'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Segredos das funções
        if: steps.cfg.outputs.ok == '1'
        run: |
          f=$(mktemp)
          for k in ASAAS_API_KEY ASAAS_AMBIENTE ASAAS_WEBHOOK_TOKEN RESEND_API_KEY EMAIL_PROVEDOR EMAIL_REMETENTE SUPORTE_EMAIL TAREFA_TOKEN; do
            v="${!k:-}"; [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> "$f"
          done
          supabase secrets set --env-file "$f" --project-ref "$SUPABASE_PROJECT_REF"
          rm -f "$f"
      - name: Funções
        if: steps.cfg.outputs.ok == '1'
        run: |
          supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy asaas-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Login e e-mails de cadastro (Auth)
        if: steps.cfg.outputs.ok == '1'
        run: |
          if [ -z "${SITE_URL:-}" ]; then echo "::warning::Sem o segredo DOMINIO: URLs e modelos de e-mail do login não foram configurados."; exit 0; fi
          if [ -n "${RESEND_API_KEY:-}" ]; then cat supabase/auth_smtp.toml >> supabase/config.toml; echo "SMTP do Resend ligado."; fi
          supabase config push --yes --project-ref "$SUPABASE_PROJECT_REF" \
            || echo "::warning::Não consegui aplicar a configuração do login. Confira em Authentication no painel do Supabase."
          git checkout -- supabase/config.toml
      - name: Domínio de e-mail (Resend)
        if: steps.cfg.outputs.ok == '1'
        run: node tools/configurar_resend.mjs
      - name: Webhook de pagamentos (Asaas)
        if: steps.cfg.outputs.ok == '1'
        run: node tools/configurar_asaas.mjs
      - name: Chaves públicas no site
        if: steps.cfg.outputs.ok == '1'
        run: |
          if [ "$(node tools/chaves_site.mjs | tail -1)" = "alterado" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
            git add assets/plano.js
            git commit -m "Chaves públicas do Supabase no site"
            git pull --rebase -q && git push
            echo "assets/plano.js preenchido com a URL e a chave pública do projeto."
          fi
      - name: Teste rápido
        if: steps.cfg.outputs.ok == '1'
        run: |
          code=$(curl -s -o /tmp/cfg -w "%{http_code}" "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/api/config")
          echo "GET config → HTTP $code"; head -c 200 /tmp/cfg; echo
          [ "$code" = "200" ]
