# Atualiza sozinho os resultados em data/*.json todos os dias.
# Funciona quando o conteúdo desta pasta está na RAIZ do repositório.
name: Atualizar resultados

on:
  schedule:
    - cron: "15 4 * * *"    # 01:15 (Brasília), depois dos sorteios da noite
    - cron: "15 13 * * *"   # 10:15 (Brasília), repescagem
  workflow_dispatch:        # botão "Run workflow" na aba Actions
    inputs:
      tudo:
        description: "Enviar o histórico inteiro ao servidor (primeira carga): sim/não"
        default: "não"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar resultados
        run: python3 atualizar_dados.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sem concursos novos."
          else
            git commit -m "Resultados atualizados em $(date -u +%Y-%m-%d)"
            git push
          fi
      # Servidor (planos): grava os concursos no Supabase e envia os avisos de resultado por e-mail.
      # Usa os segredos do Supabase (SUPABASE_PROJECT_REF e SUPABASE_DB_PASSWORD); sem eles o passo só avisa e segue.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Endereço e token do servidor
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MEGACOVER_API_URL: ${{ secrets.MEGACOVER_API_URL }}
          TAREFA_TOKEN: ${{ secrets.TAREFA_TOKEN }}
        run: bash tools/segredos.sh
      - name: Enviar ao servidor e avisar por e-mail
        run: node tools/enviar_concursos.mjs ${{ github.event.inputs.tudo == 'sim' && '--tudo' || '' }}
