# Testa, de dentro do GitHub, quais fontes de resultados respondem.
name: Diagnóstico das fontes
on:
  workflow_dispatch: {}
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar fontes
        run: |
          t() { local rot="$1"; shift; rm -f /tmp/r; echo "=== $rot"; curl -sS -m 25 -o /tmp/r -w "HTTP %{http_code} · %{size_download} bytes · CORS=%header{access-control-allow-origin}\n" "$@" || echo "falhou"; [ -f /tmp/r ] && head -c 220 /tmp/r | tr '\n' ' '; echo; echo; }
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          C=https://servicebus2.caixa.gov.br/portaldeloterias/api/megasena
          t "caixa · só UA" -A "$UA" "$C"
          t "caixa · UA+Accept" -A "$UA" -H 'Accept: application/json' "$C"
          t "caixa · curl puro" "$C"
          t "caixa · home/ultimos-resultados" -A "$UA" "https://servicebus2.caixa.gov.br/portaldeloterias/api/home/ultimos-resultados"
          t "site caixa (HTML)" -A "$UA" "https://loterias.caixa.gov.br/Paginas/Mega-Sena.aspx"
          t "proxy allorigins" "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$C',safe=''))")"
          t "proxy corsproxy.io" "https://corsproxy.io/?url=$C"
          t "proxy codetabs" "https://api.codetabs.com/v1/proxy/?quest=$C"
          t "eitchtee · último commit da base" "https://api.github.com/repos/eitchtee/loterias.json/commits?per_page=1&path=data/mega-sena.json"
          python3 -c "import json;d=json.load(open('/tmp/r'));print('commit em:',d[0]['commit']['committer']['date'])" || true
          curl -sS -m 40 -o /tmp/e "https://raw.githubusercontent.com/eitchtee/loterias.json/main/data/mega-sena.json" && python3 -c "import json;d=json.load(open('/tmp/e'));print('eitchtee mega último:',d[-1]['concurso'],d[-1]['data'])"
          t "eitchtee · workflow runs" "https://api.github.com/repos/eitchtee/loterias.json/actions/runs?per_page=1"
          python3 -c "import json;d=json.load(open('/tmp/r'))['workflow_runs'][0];print('última execução:',d['created_at'],d['conclusion'])" || true
