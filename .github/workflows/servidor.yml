# Publica o servidor no Supabase: banco (migrações), funções e segredos.
# Roda sozinho quando algo muda em supabase/ e também pelo botão "Run workflow" na aba Actions.
# Segredos necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   token pessoal (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF    código do projeto (Settings → General → Reference ID)
#   SUPABASE_DB_PASSWORD    senha do banco escolhida ao criar o projeto
# Opcionais (enviados às funções): ASAAS_API_KEY, ASAAS_AMBIENTE, ASAAS_WEBHOOK_TOKEN, RESEND_API_KEY,
#   EMAIL_PROVEDOR, EMAIL_REMETENTE, SUPORTE_EMAIL, TAREFA_TOKEN
name: Publicar servidor

on:
  push:
    branches: [main]
    paths: ["supabase/**", "assets/regras.json", "assets/permissoes.js", "assets/engine.js"]
  workflow_dispatch: {}

concurrency: servidor

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir configuração
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase ainda não configurado (faltam segredos). Nada foi publicado."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == '1'
        with:
          node-version: "20"
      - name: Conferir cópias das regras
        if: steps.cfg.outputs.ok == '1'
        run: node tools/sincronizar.mjs --verificar
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == '1'
        with:
          version: latest
      - name: Banco de dados (migrações)
        if: steps.cfg.outputs.ok == '1'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Segredos das funções
        if: steps.cfg.outputs.ok == '1'
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_AMBIENTE: ${{ secrets.ASAAS_AMBIENTE }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_PROVEDOR: ${{ secrets.EMAIL_PROVEDOR }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SUPORTE_EMAIL: ${{ secrets.SUPORTE_EMAIL }}
          TAREFA_TOKEN: ${{ secrets.TAREFA_TOKEN }}
        run: |
          f=$(mktemp)
          for k in ASAAS_API_KEY ASAAS_AMBIENTE ASAAS_WEBHOOK_TOKEN RESEND_API_KEY EMAIL_PROVEDOR EMAIL_REMETENTE SUPORTE_EMAIL TAREFA_TOKEN; do
            v="${!k}"; [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> "$f"
          done
          if [ -s "$f" ]; then supabase secrets set --env-file "$f" --project-ref "$SUPABASE_PROJECT_REF"; else echo "Nenhum segredo opcional definido."; fi
          rm -f "$f"
      - name: Funções
        if: steps.cfg.outputs.ok == '1'
        run: |
          supabase functions deploy api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy asaas-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
      - name: Teste rápido
        if: steps.cfg.outputs.ok == '1'
        run: |
          code=$(curl -s -o /tmp/cfg -w "%{http_code}" "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/api/config")
          echo "GET config → HTTP $code"; head -c 200 /tmp/cfg; echo
          [ "$code" = "200" ]
